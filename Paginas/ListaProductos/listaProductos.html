<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Productos</title>
  <script type="module" src="listaProductos.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/Paginas/AgregarProducto/agregarProducto.css">
  <link rel="stylesheet" href="/Modulos/navBar/navBar.css">
  <link rel="stylesheet" href="/Modulos/Footer/footer.css">
  <link rel="stylesheet" href="/Paginas/ListaProductos/listaProductos.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="agregar-producto-container">
    <div class="product-list-header text-center mt-4 mb-3">
      <h2 class="product-list-title d-flex flex-column flex-md-row align-items-center justify-content-center gap-2">
        <i class="bi bi-box-seam"></i>
        <span>Lista de Productos</span>
      </h2>
    </div>

    <form class="container-fluid mb-4">
      <div class="row g-2 justify-content-center">
        <div class="col-12 col-md-3">
          <select id="filterCategory" class="form-select">
            <option value="">Todos</option>
            <option value="automotriz">Automotriz</option>
            <option value="construccion">Construcción</option>
            <option value="electricidad">Electricidad</option>
            <option value="gasfiteria">Gasfitería</option>
            <option value="griferia">Grifería</option>
            <option value="herramientas">Herramientas</option>
            <option value="jardineria">Jardinería</option>
            <option value="pinturas">Pinturas</option>
            <option value="seguridad">Seguridad</option>
          </select>
        </div>
        <div class="col-12 col-md-5">
          <input type="text" id="searchProduct" class="form-control" placeholder="Buscar por producto por nombre">
        </div>
        <div class="col-12 col-md-2 d-grid gap-2">
          <button id="searchButton" type="button" class="btn btn-success w-100 mb-2">
            <i class="bi bi-search"></i> Buscar
          </button>
          <button id="resetFiltersButton" type="button" class="btn btn-outline-secondary w-100">
            <i class="bi bi-arrow-counterclockwise"></i> Reiniciar
          </button>
        </div>
      </div>
    </form>

    <ul id="productList" class="product-list"></ul>
    <div id="pagination" class="pagination-container"></div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="/Modulos/navBar/navBar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
