<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra</title>
  <link rel="stylesheet" href="productos.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/Modulos/navBar/navBar.css">
  <link rel="stylesheet" href="/Modulos/Footer/footer.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <h1>Compra de Productos</h1>
  
  <!-- Botón para abrir filtros en móvil -->
  <button id="abrirFiltrosBtn" type="button">
    <i class="bi bi-filter-left"></i> Filtros
  </button>
  <!-- Overlay para drawer -->
  <div id="filtrosOverlay"></div>

  <div class="productos-layout">
    <!-- Contenedor lateral de filtros -->
    <div id="filtersContainer">
      <!-- Botón cerrar solo visible en móvil -->
      <button class="close-filtros-btn" type="button">
        <i class="bi bi-x-lg"></i> Filtros
      </button>
      <h2>Filtros</h2>
      <!-- Botones de categoría dentro del panel de filtros -->
      <div id="categoryButtons">
        <!-- Aquí se generarán los botones de categorías dinámicamente -->
      </div>
      <details open>
        <summary>Buscar por nombre</summary>
        <div>
          <input type="text" id="searchInput" placeholder="Escribe el nombre del producto">
          <button id="searchButton">Buscar</button>
        </div>
      </details>
      <details>
        <summary>Filtrar por precio</summary>
        <div>
          <input type="number" id="minPrice" placeholder="Precio mínimo">
          <input type="number" id="maxPrice" placeholder="Precio máximo">
        </div>
      </details>
      <details>
        <summary>Disponibilidad</summary>
        <div>
          <select id="availabilityFilter">
            <option value="">Todos</option>
            <option value="available">Disponible</option>
            <option value="unavailable">Sin stock</option>
          </select>
        </div>
      </details>
      <button id="applyFiltersButton">Aplicar filtros</button>
      <button id="resetFiltersButton">Reiniciar filtros</button>
    </div>

    <!-- Contenedor de productos -->
    <div class="productos-main">
      <div id="productContainer"></div>
      <div id="paginationContainer"></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
</body>
<script type="module" src="productos.js"></script>
<script src="/Modulos/navBar/navBar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
